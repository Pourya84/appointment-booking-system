{% extends 'base.html' %}
{% block title %}افزودن خدمت جدید{% endblock %}
{% block content %}
<h2>➕ افزودن نوع خدمت جدید</h2>
<form method="post">
    {% csrf_token %}
    <label>نام خدمت:</label>
    <input type="text" name="name" required><br>
    <label>مدت زمان (دقیقه):</label>
    <input type="number" name="duration_minutes" min="1" step="1" required><br>
    <label>قیمت (تومان):</label>
    <input type="number" name="price" min="0" step="1000" required><br>
    <input type="submit" value="ذخیره">
</form>
<p><a href="{% url 'manage_service_types' %}">← بازگشت به لیست خدمات</a></p>
{% endblock %}
