{% extends 'base.html' %}
{% block title %}بازیابی رمز عبور{% endblock %}
{% block content %}
<h2>🔐 بازیابی رمز عبور</h2>
<p>ایمیل خود را وارد کنید تا لینک تنظیم رمز جدید برای شما ارسال شود.</p>
<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <input type="submit" value="ارسال لینک">
</form>
<p><a href="{% url 'login' %}">← بازگشت به صفحه ورود</a></p>
{% endblock %}
